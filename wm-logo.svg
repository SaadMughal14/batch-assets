<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E1A4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8884A"/>
    </linearGradient>
    <linearGradient id="goldGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E1A4"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8884A"/>
    </linearGradient>
  </defs>

  <!-- Outer thin gold ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.85"/>
  <!-- Inner delicate ring -->
  <circle cx="100" cy="100" r="87" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.5"/>

  <!-- Watch crown accent (right side, between rings) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <rect x="191" y="94" width="6" height="12" rx="1.5"/>
  </g>

  <!-- W letter (left, elegant serif strokes) -->
  <g>
    <polyline points="32,66 54,134 76,66 98,134 120,66" fill="none" stroke="url(#goldGradV)" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter"/>
    <!-- Top serifs for W -->
    <rect x="25" y="61" width="14" height="5" fill="url(#goldGradV)"/>
    <rect x="69" y="61" width="14" height="5" fill="url(#goldGradV)"/>
    <rect x="113" y="61" width="14" height="5" fill="url(#goldGradV)"/>
    <!-- Bottom serifs for W -->
    <rect x="42" y="134" width="24" height="5" fill="url(#goldGradV)"/>
    <rect x="86" y="134" width="24" height="5" fill="url(#goldGradV)"/>
  </g>

  <!-- M letter (right, serif, elegant) -->
  <g fill="url(#goldGradV)">
    <path d="
      M 124 134
      L 124 66
      L 136 66
      L 150 108
      L 166 66
      L 180 66
      L 180 134
      L 169 134
      L 169 82
      L 160 121
      L 150 121
      L 141 82
      L 141 134
      Z
    "/>
    <!-- Top serifs for M -->
    <rect x="120" y="61" width="20" height="5"/>
    <rect x="176" y="61" width="16" height="5"/>
    <!-- Bottom serifs for M -->
    <rect x="120" y="134" width="21" height="5"/>
    <rect x="176" y="134" width="16" height="5"/>
  </g>

  <!-- Bottom flourish line + diamond -->
  <g opacity="0.85">
    <line x1="62" y1="156" x2="92" y2="156" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <line x1="108" y1="156" x2="138" y2="156" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <polygon points="100,150 105,156 100,162 95,156" fill="url(#goldGrad)"/>
  </g>

  <!-- Top flourish line + diamond -->
  <g opacity="0.6">
    <line x1="62" y1="44" x2="92" y2="44" stroke="url(#goldGrad)" stroke-width="0.6"/>
    <line x1="108" y1="44" x2="138" y2="44" stroke="url(#goldGrad)" stroke-width="0.6"/>
    <polygon points="100,40 103,44 100,48 97,44" fill="url(#goldGrad)"/>
  </g>
</svg>
